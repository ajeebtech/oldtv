<script>
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.seg [data-view]');
    if (!b) return;
    e.preventDefault();
    var g = document.querySelector('.grid'), v = b.getAttribute('data-view');
    g.classList.toggle('list', v === 'list');
    document.querySelectorAll('.seg [data-view]').forEach(function (x) { x.classList.toggle('on', x === b); });
