<script>
OLDTV.ready(function () {
  function go(form) {
    if (OLDTV.mode() !== 'film') return;
    var q = (form.querySelector('[name=q]') || {}).value || '';
    if (!q.trim()) return;
    try { sessionStorage.setItem('oldtv:google2005:q', q.trim()); } catch (e) {}
    location.href = '2005-results.html';
  }
  document.addEventListener('submit', function (e) { if (e.target.id === 'gs') go(e.target); });
  var q = document.getElementById('q');
  if (q && OLDTV.mode() === 'film') q.focus();
});
</script>
